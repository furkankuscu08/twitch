[project]
name = "minefield"
version = "0.1.0"
description = "A Twitch game where viewers plant secret words."
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.9", "wordfreq>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: requires network access and local credentials"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["twitch"]

[tool.ruff.lint]
select = ["E", "F", "I"]
