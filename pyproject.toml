[project]
name = "minefield"
version = "0.1.0"
description = "A Twitch game where viewers plant secret words."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.9", "wordfreq>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not browser'"
markers = [
    "live: requires network access and local credentials",
    "browser: requires Playwright and Chromium",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["twitch"]

[tool.ruff.lint]
select = ["E", "F", "I"]
